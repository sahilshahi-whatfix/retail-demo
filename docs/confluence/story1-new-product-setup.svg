<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1178" viewBox="0 0 1120 1178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6368"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1f1f">Story 1: New product setup from a forwarded supplier email</text>
<rect x="70" y="432" width="460" height="470" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-dasharray="5 4"/><text x="86" y="456" font-size="13" font-weight="700" fill="#5f6368" letter-spacing=".4">HARLOW: LIVE PATH</text>
<rect x="600" y="432" width="460" height="362" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-dasharray="5 4"/><text x="616" y="456" font-size="13" font-weight="700" fill="#5f6368" letter-spacing=".4">ASHBY: HOLD PATH</text>
<rect x="300" y="60" width="520" height="74" rx="10" fill="#fce8e6" stroke="#b3261e" stroke-opacity=".45" stroke-width="1.5"/><rect x="312" y="70" width="49" height="18" rx="9" fill="#b3261e"/><text x="336.5" y="83" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">GMAIL</text><text x="314" y="107" font-size="14" fill="#1f1f1f" font-weight="600">Noah forwards the supplier email to Seek</text><text x="314" y="125" font-size="14" fill="#1f1f1f">Dana’s email with 2 spec sheets and 5 photos attached</text>
<rect x="300" y="166" width="520" height="92" rx="10" fill="#fce8e6" stroke="#b3261e" stroke-opacity=".45" stroke-width="1.5"/><rect x="312" y="176" width="49" height="18" rx="9" fill="#b3261e"/><text x="336.5" y="189" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">GMAIL</text><text x="314" y="213" font-size="14" fill="#1f1f1f" font-weight="600">Seek reads the email and every attachment once</text><text x="314" y="231" font-size="14" fill="#1f1f1f">PDF spec tables, the line drawings, each photo full size</text><text x="314" y="249" font-size="14" fill="#1f1f1f">Writes a spec ledger: one line per value, with its source</text>
<rect x="80" y="470" width="440" height="92" rx="10" fill="#fdeee0" stroke="#9a4a0b" stroke-opacity=".45" stroke-width="1.5"/><rect x="92" y="480" width="55.599999999999994" height="18" rx="9" fill="#9a4a0b"/><text x="119.8" y="493" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">ORACLE</text><text x="94" y="517" font-size="14" fill="#1f1f1f" font-weight="600">Create the item from the ledger</text><text x="94" y="535" font-size="14" fill="#1f1f1f">Attributes, cost, MSRP, photos, spec sheet</text><text x="94" y="553" font-size="14" fill="#1f1f1f">Save → Approve → Release to Channels</text>
<rect x="80" y="594" width="440" height="74" rx="10" fill="#e6f4ea" stroke="#146c2e" stroke-opacity=".45" stroke-width="1.5"/><rect x="92" y="604" width="62.199999999999996" height="18" rx="9" fill="#146c2e"/><text x="123.1" y="617" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">SHOPIFY</text><text x="94" y="641" font-size="14" fill="#1f1f1f" font-weight="600">Product arrives by sync; check media</text><text x="94" y="659" font-size="14" fill="#1f1f1f">Publish to Online Store and Mobile App</text>
<rect x="80" y="700" width="440" height="74" rx="10" fill="#fff4d6" stroke="#7a5200" stroke-opacity=".45" stroke-width="1.5"/><rect x="92" y="710" width="55.599999999999994" height="18" rx="9" fill="#7a5200"/><text x="119.8" y="723" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">AMAZON</text><text x="94" y="747" font-size="14" fill="#1f1f1f" font-weight="600">Create the listing in Seller Central</text><text x="94" y="765" font-size="14" fill="#1f1f1f">All tabs from the ledger, then submit</text>
<rect x="80" y="806" width="440" height="74" rx="10" fill="#eef0f3" stroke="#3c4043" stroke-opacity=".45" stroke-width="1.5"/><rect x="92" y="816" width="62.199999999999996" height="18" rx="9" fill="#3c4043"/><text x="123.1" y="829" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">WEBSITE</text><rect x="160.2" y="816" width="55.599999999999994" height="18" rx="9" fill="#7a5200"/><text x="188" y="829" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">AMAZON</text><text x="94" y="853" font-size="14" fill="#1f1f1f" font-weight="600">Check what customers see</text><text x="94" y="871" font-size="14" fill="#1f1f1f">Name, price, color, dimensions, main image</text>
<rect x="610" y="470" width="440" height="92" rx="10" fill="#fdeee0" stroke="#9a4a0b" stroke-opacity=".45" stroke-width="1.5"/><rect x="622" y="480" width="55.599999999999994" height="18" rx="9" fill="#9a4a0b"/><text x="649.8" y="493" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">ORACLE</text><text x="624" y="517" font-size="14" fill="#1f1f1f" font-weight="600">Save the item, leave the conflict empty</text><text x="624" y="535" font-size="14" fill="#1f1f1f">Put on Hold, with a note: width 84 in</text><text x="624" y="553" font-size="14" fill="#1f1f1f">(spec table) vs 86 in (front-view drawing)</text>
<rect x="610" y="594" width="440" height="74" rx="10" fill="#e6f4ea" stroke="#146c2e" stroke-opacity=".45" stroke-width="1.5"/><rect x="622" y="604" width="62.199999999999996" height="18" rx="9" fill="#146c2e"/><text x="653.1" y="617" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">SHOPIFY</text><rect x="690.2" y="604" width="55.599999999999994" height="18" rx="9" fill="#7a5200"/><text x="718" y="617" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">AMAZON</text><text x="624" y="641" font-size="14" fill="#1f1f1f" font-weight="600">Not created</text><text x="624" y="659" font-size="14" fill="#1f1f1f">Blocked until the supplier confirms the width</text>
<rect x="610" y="700" width="440" height="58" rx="10" fill="#ffffff" stroke="#3c4043" stroke-opacity=".45" stroke-width="1.5"/><text x="624" y="728" font-size="14" fill="#1f1f1f" font-weight="600">Seek does not contact the supplier</text><text x="624" y="746" font-size="14" fill="#1f1f1f">Only Noah is told; he follows up with the brand</text>
<rect x="340" y="930" width="440" height="92" rx="10" fill="#e8f0fe" stroke="#1a56b4" stroke-opacity=".45" stroke-width="1.5"/><rect x="352" y="940" width="101.8" height="18" rx="9" fill="#1a56b4"/><text x="402.9" y="953" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">GOOGLE SHEETS</text><text x="354" y="977" font-size="14" fill="#1f1f1f" font-weight="600">Log every action in the Seek audit log</text><text x="354" y="995" font-size="14" fill="#1f1f1f">3 rows per product: Oracle, Shopify,</text><text x="354" y="1013" font-size="14" fill="#1f1f1f">Amazon, each with its status and link</text>
<rect x="280" y="1054" width="560" height="92" rx="10" fill="#fce8e6" stroke="#b3261e" stroke-opacity=".45" stroke-width="1.5"/><rect x="292" y="1064" width="49" height="18" rx="9" fill="#b3261e"/><text x="316.5" y="1077" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">GMAIL</text><text x="294" y="1101" font-size="14" fill="#1f1f1f" font-weight="600">Reply to Noah, once, on the same thread</text><text x="294" y="1119" font-size="14" fill="#1f1f1f">Harlow: live, with website, Amazon and Shopify links</text><text x="294" y="1137" font-size="14" fill="#1f1f1f">Ashby: on hold, the conflict and what is needed</text>
<polygon points="560,292 710,347 560,402 410,347" fill="#fff" stroke="#5f6368" stroke-width="1.5"/><text x="560" y="343" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Any value missing</text><text x="560" y="361" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">or in conflict?</text>
<polyline points="560,134 560,164" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="560,258 560,290" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="410,347 300,347 300,468" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/><text x="312" y="339" text-anchor="start" font-size="13" font-weight="600" fill="#3c4043">No: Harlow</text>
<polyline points="710,347 830,347 830,468" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/><text x="818" y="339" text-anchor="end" font-size="13" font-weight="600" fill="#3c4043">Yes: Ashby</text>
<polyline points="300,562 300,592" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="300,668 300,698" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="300,774 300,804" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="830,562 830,592" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="830,668 830,698" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="300,880 300,976 338,976" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="830,758 830,976 782,976" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="560,1022 560,1052" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
</svg>