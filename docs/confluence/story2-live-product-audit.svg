<polyline points="830,1004 830,1102 782,1102" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="560,1148 560,1178" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
