<polyline points="560,488 560,518" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="410,575 300,575 300,698" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/><text x="312" y="567" text-anchor="start" font-size="13" font-weight="600" fill="#3c4043">No: Merriam</text>
<polyline points="710,575 830,575 830,698" fill="none" stroke="#5f6368" stroke-width="1.6" marker-end="url(#a)"/><text x="818" y="567" text-anchor="end" font-size="13" font-weight="600" fill="#3c4043">Yes: Calder</text>
