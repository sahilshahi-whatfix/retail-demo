<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1286" viewBox="0 0 1120 1286" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6368"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f1f1f">Story 2: Live product page audit from a linked audit list</text>
<rect x="70" y="662" width="460" height="136" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-dasharray="5 4"/><text x="86" y="686" font-size="13" font-weight="700" fill="#5f6368" letter-spacing=".4">NO: VERIFIED</text>
<rect x="600" y="662" width="460" height="372" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-dasharray="5 4"/><text x="616" y="686" font-size="13" font-weight="700" fill="#5f6368" letter-spacing=".4">YES: FIX, THEN PROVE IT</text>
<rect x="290" y="60" width="540" height="74" rx="10" fill="#fce8e6" stroke="#b3261e" stroke-opacity=".45" stroke-width="1.5"/><rect x="302" y="70" width="49" height="18" rx="9" fill="#b3261e"/><text x="326.5" y="83" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">GMAIL</text><text x="304" y="107" font-size="14" fill="#1f1f1f" font-weight="600">Noah emails Seek this week’s catalog audit</text><text x="304" y="125" font-size="14" fill="#1f1f1f">A link to the audit list in Google Sheets, no attachments</text>
<rect x="290" y="166" width="540" height="92" rx="10" fill="#e8f0fe" stroke="#1a56b4" stroke-opacity=".45" stroke-width="1.5"/><rect x="302" y="176" width="101.8" height="18" rx="9" fill="#1a56b4"/><text x="352.9" y="189" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">GOOGLE SHEETS</text><text x="304" y="213" font-size="14" fill="#1f1f1f" font-weight="600">Seek opens the audit list</text><text x="304" y="231" font-size="14" fill="#1f1f1f">One row per product: why it is on the list, page links,</text><text x="304" y="249" font-size="14" fill="#1f1f1f">spec sheet link, approved photos, what to check</text>
<rect x="290" y="290" width="540" height="92" rx="10" fill="#fdeee0" stroke="#9a4a0b" stroke-opacity=".45" stroke-width="1.5"/><rect x="302" y="300" width="55.599999999999994" height="18" rx="9" fill="#9a4a0b"/><text x="329.8" y="313" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">ORACLE</text><text x="304" y="337" font-size="14" fill="#1f1f1f" font-weight="600">Opens each spec sheet and the approved photos</text><text x="304" y="355" font-size="14" fill="#1f1f1f">From the item’s attachments and images, read-only</text><text x="304" y="373" font-size="14" fill="#1f1f1f">Writes the audit ledger, ignoring old or struck-out values</text>
<rect x="290" y="414" width="540" height="74" rx="10" fill="#eef0f3" stroke="#3c4043" stroke-opacity=".45" stroke-width="1.5"/><rect x="302" y="424" width="62.199999999999996" height="18" rx="9" fill="#3c4043"/><text x="333.1" y="437" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">WEBSITE</text><rect x="370.2" y="424" width="55.599999999999994" height="18" rx="9" fill="#7a5200"/><text x="398" y="437" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">AMAZON</text><text x="304" y="461" font-size="14" fill="#1f1f1f" font-weight="600">Compares each live product page with the ledger</text><text x="304" y="479" font-size="14" fill="#1f1f1f">Name, dimensions, materials, color, weight, photos</text>
<rect x="80" y="700" width="440" height="76" rx="10" fill="#ffffff" stroke="#3c4043" stroke-opacity=".45" stroke-width="1.5"/><text x="94" y="728" font-size="14" fill="#1f1f1f" font-weight="600">Merriam Dining Table</text><text x="94" y="746" font-size="14" fill="#1f1f1f">Every value matches on both channels</text><text x="94" y="764" font-size="14" fill="#1f1f1f">Verified, no changes</text>
<rect x="610" y="700" width="440" height="92" rx="10" fill="#eef0f3" stroke="#3c4043" stroke-opacity=".45" stroke-width="1.5"/><rect x="622" y="710" width="62.199999999999996" height="18" rx="9" fill="#3c4043"/><text x="653.1" y="723" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">WEBSITE</text><text x="624" y="747" font-size="14" fill="#1f1f1f" font-weight="600">Calder Loveseat (2 “color not as pictured” returns)</text><text x="624" y="765" font-size="14" fill="#1f1f1f">Main photo shows the navy colorway;</text><text x="624" y="783" font-size="14" fill="#1f1f1f">spec sheet and approved photos say Slate Grey</text>
<rect x="610" y="824" width="440" height="74" rx="10" fill="#e6f4ea" stroke="#146c2e" stroke-opacity=".45" stroke-width="1.5"/><rect x="622" y="834" width="62.199999999999996" height="18" rx="9" fill="#146c2e"/><text x="653.1" y="847" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">SHOPIFY</text><text x="624" y="871" font-size="14" fill="#1f1f1f" font-weight="600">Replace the featured image</text><text x="624" y="889" font-size="14" fill="#1f1f1f">with the approved calder_slate_front.jpg</text>
<rect x="610" y="930" width="440" height="74" rx="10" fill="#eef0f3" stroke="#3c4043" stroke-opacity=".45" stroke-width="1.5"/><rect x="622" y="940" width="62.199999999999996" height="18" rx="9" fill="#3c4043"/><text x="653.1" y="953" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">WEBSITE</text><text x="624" y="977" font-size="14" fill="#1f1f1f" font-weight="600">Re-verify on the live product page</text><text x="624" y="995" font-size="14" fill="#1f1f1f">The slate photo now shows first</text>
<rect x="340" y="1056" width="440" height="92" rx="10" fill="#e8f0fe" stroke="#1a56b4" stroke-opacity=".45" stroke-width="1.5"/><rect x="352" y="1066" width="101.8" height="18" rx="9" fill="#1a56b4"/><text x="402.9" y="1079" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">GOOGLE SHEETS</text><text x="354" y="1103" font-size="14" fill="#1f1f1f" font-weight="600">Record the results</text><text x="354" y="1121" font-size="14" fill="#1f1f1f">Audit list: the three result columns</text><text x="354" y="1139" font-size="14" fill="#1f1f1f">Audit log: a row per product per channel</text>
<rect x="270" y="1180" width="580" height="74" rx="10" fill="#fce8e6" stroke="#b3261e" stroke-opacity=".45" stroke-width="1.5"/><rect x="282" y="1190" width="49" height="18" rx="9" fill="#b3261e"/><text x="306.5" y="1203" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" letter-spacing=".3">GMAIL</text><text x="284" y="1227" font-size="14" fill="#1f1f1f" font-weight="600">Reply to Noah on the same thread</text><text x="284" y="1245" font-size="14" fill="#1f1f1f">What was verified, what was fixed and why, with links</text>
<polygon points="560,520 710,575 560,630 410,575" fill="#fff" stroke="#5f6368" stroke-width="1.5"/><text x="560" y="571" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">Clear mismatch</text><text x="560" y="589" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1f1f">with the spec sheet?</text>
